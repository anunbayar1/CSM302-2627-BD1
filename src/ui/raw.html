<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Pthreads</title>
<style>
:root{
  --bg:#f4f5f8; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --soft:#f1f5f9;
  --accent:#2563eb; --accent-soft:#dbeafe;
  --green:#16a34a; --green-soft:#dcfce7; --blue:#2563eb; --blue-soft:#dbeafe;
  --amber:#d97706; --amber-soft:#fef3c7; --red:#dc2626; --red-soft:#fee2e2;
  --violet:#7c3aed; --violet-soft:#ede9fe; --gray:#94a3b8;
  --term:#0b1220; --term-ink:#cbd5e1;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b0f17;--card:#121826;--ink:#e2e8f0;--muted:#94a3b8;--line:#1f2a3c;--soft:#172033;
        --accent:#60a5fa;--accent-soft:#172554;
        --green:#4ade80;--green-soft:#0f2e1c;--blue:#60a5fa;--blue-soft:#13254a;
        --amber:#fbbf24;--amber-soft:#3a2a0b;--red:#f87171;--red-soft:#3b1414;
        --violet:#c4b5fd;--violet-soft:#2a1f4a;--gray:#64748b;--term:#05080f;
        --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",sans-serif;display:flex;flex-direction:column}
.mono,code,pre,.num{font-family:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- header ---------- */
header{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.back{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700}
.back:hover{border-color:var(--accent)}
.title{display:flex;align-items:center;gap:10px}
.title h1{margin:0;font-size:16px;font-weight:700}
.tag{font:700 11px ui-monospace,monospace;padding:3px 8px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.status{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font:600 12.5px system-ui,sans-serif;background:var(--soft);color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.run{background:var(--green-soft);color:var(--green)} .pill.run::before{animation:pulse 1.2s infinite}
.pill.pause{background:var(--violet-soft);color:var(--violet)} .pill.stop{background:var(--red-soft);color:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.clock{font:600 13px ui-monospace,monospace;color:var(--muted);min-width:70px;text-align:right}

/* ---------- page grid (fits one screen on desktop) ---------- */
main{flex:1;min-height:0;display:grid;gap:12px;padding:12px 20px 16px;
     grid-template-rows:auto minmax(0,1fr) minmax(140px,27%);width:100%;max-width:1680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.label{font:600 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .label{font-size:10.5px}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--soft);height:34px}
.stp button{border:0;background:transparent;width:26px;height:100%;font-size:17px;font-weight:700;border-radius:10px}
.stp button:hover:not(:disabled){background:var(--line)}
.stp button:disabled{opacity:.35;cursor:not-allowed}
.stp input{width:34px;border:0;background:transparent;text-align:center;font:700 15px ui-monospace,monospace;color:var(--ink);-moz-appearance:textfield}
.stp input::-webkit-inner-spin-button,.stp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--soft);height:34px;padding:3px;gap:2px}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button{border:0;background:transparent;border-radius:7px;padding:0 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg.p button.on{color:var(--green)} .seg.c button.on{color:var(--blue)}
.vsep{width:1px;align-self:stretch;background:var(--line)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.actions{margin-left:auto;display:flex;gap:8px}
.btn{height:36px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 11px;white-space:nowrap;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.icon{width:36px;padding:0;justify-content:center}
.err{display:none;margin:0 14px 10px;color:var(--red);font-weight:600}

/* ---------- stage: producers → buffer → consumers ---------- */
.stage{display:grid;grid-template-columns:minmax(190px,1fr) 32px minmax(0,2.4fr) 32px minmax(190px,1fr);padding:14px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0}
.colhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.colhead .dot{width:9px;height:9px;border-radius:50%}
.colhead b{font-size:14px}
.threads{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0;padding:2px}
.th{border:1px solid var(--line);border-left:4px solid var(--gray);border-radius:10px;padding:7px 10px;background:var(--card);transition:background .2s,border-color .2s}
.th .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.th .nm{font:700 14px ui-monospace,monospace}
.th .st{font:700 11px ui-monospace,monospace;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.th code{display:block;margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th[data-st=producing]{border-left-color:var(--green)} .th[data-st=producing] .st{background:var(--green-soft);color:var(--green)}
.th[data-st=consuming]{border-left-color:var(--blue)} .th[data-st=consuming] .st{background:var(--blue-soft);color:var(--blue)}
.th[data-st=waiting]{border-left-color:var(--amber);background:var(--amber-soft)} .th[data-st=waiting] .st{background:var(--amber);color:#fff}
.th[data-st=waiting] code{color:var(--amber);font-weight:700}
.th[data-st=paused]{border-left-color:var(--violet)} .th[data-st=paused] .st{background:var(--violet-soft);color:var(--violet)}
.th[data-st=stopped],.th[data-st=idle]{opacity:.6}
.th.hit{animation:hit .55s ease-out}
.th.bad{animation:bad .8s ease-out}
@keyframes bad{0%{box-shadow:0 0 0 4px var(--red)}100%{box-shadow:0 0 0 0 transparent}}
.th.crit{border-left-color:var(--red)!important;background:var(--red-soft)!important} .th.crit code{color:var(--red)!important;font-weight:700}
.th.crit .st{background:var(--red)!important;color:#fff!important}
@keyframes hit{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.flow{display:grid;place-items:center;color:var(--line);font-size:22px;font-weight:800}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}

.center{display:flex;flex-direction:column;min-height:0;gap:12px}
.bufwrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft)}
.bufhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bufhead code{font-size:12px;color:var(--muted)}
.buf{display:grid;gap:6px}
.ptr{text-align:center;height:20px}
.ptr span{display:none;font:700 11px ui-monospace,monospace;padding:2px 7px;border-radius:999px}
.ptr.on span{display:inline-block}
.ptr.out span{background:var(--blue-soft);color:var(--blue)} .ptr.in span{background:var(--green-soft);color:var(--green)}
.cell{height:clamp(40px,10vh,120px);border-radius:10px;border:2px dashed var(--line);background:var(--card);display:grid;place-items:center;font:800 clamp(15px,2.6vh,28px) ui-monospace,monospace;color:var(--muted);transition:background .2s,border-color .2s}
.cell.full{border:2px solid var(--amber);background:var(--amber-soft);color:var(--ink)}
.cell.fin{animation:fin .55s ease-out} .cell.fout{animation:fout .55s ease-out}
.cell.race{border:2px solid var(--red)!important;background:var(--red-soft)!important;color:var(--red)!important;animation:ferr .7s ease-out}
@keyframes ferr{0%{box-shadow:0 0 0 7px var(--red);transform:scale(1.1)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
@keyframes fin{0%{box-shadow:0 0 0 5px var(--green);transform:scale(1.07)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
@keyframes fout{0%{box-shadow:0 0 0 5px var(--blue);transform:scale(.93)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.idx{text-align:center;font:11px ui-monospace,monospace;color:var(--muted);margin-top:3px}
.last{margin-top:6px;text-align:center;font:700 14px ui-monospace,monospace;min-height:20px;color:var(--muted)}
.last .in{color:var(--green)} .last .out{color:var(--blue)}

.sems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.15fr);gap:10px;flex:none}
.sem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);min-width:0}
.sem .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sem .name{font:700 13px ui-monospace,monospace}
.sem .type{font:10px ui-monospace,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sem .val{font:800 30px ui-monospace,monospace;line-height:1.15;margin:4px 0 6px}
.sem.zero{border-color:var(--red);background:var(--red-soft)} .sem.zero .val{color:var(--red)}
.bar{display:flex;gap:3px;min-height:10px}
.bar i{flex:1;max-width:12px;height:10px;border-radius:3px;background:var(--line)}
#sEmpty .bar i.on{background:var(--green)} #sFull .bar i.on{background:var(--amber)}
.lock{display:flex;align-items:center;gap:8px;margin-top:6px;height:34px}
.lock svg{width:30px;height:30px;flex:none}
.lock b{font:800 17px ui-monospace,monospace}
.mq{margin-top:4px;display:flex;gap:4px;align-items:center;min-height:18px;font:11px ui-monospace,monospace;color:var(--muted)}
.mq .w{background:var(--amber);color:#fff;border-radius:999px;padding:0 6px;font-weight:700}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;align-items:end}
.totals div{font-size:10.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.totals b{display:block;font:800 20px ui-monospace,monospace;color:var(--ink)}
.check{margin-top:8px;font:700 12px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);text-align:center}
.check.ok{background:var(--green-soft);color:var(--green)} .check.bad{background:var(--red-soft);color:var(--red)}
.racebadge{display:none;font:800 12px ui-monospace,monospace;padding:3px 9px;border-radius:999px;background:var(--red);color:#fff}
.racebadge.on{display:inline-block}
#sMutex.off{color:var(--gray)!important;background:var(--soft)} #sMutex.off .lock b{text-decoration:line-through}
.sl{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.sl input{width:118px;accent-color:var(--accent)}
@media (max-width:1500px){.sl input{width:84px}.sl{padding:0 8px;gap:6px}.sl output{min-width:44px;font-size:12px}}
.sl.p input{accent-color:var(--green)} .sl.c input{accent-color:var(--blue)}
.sl output{font:700 13px ui-monospace,monospace;min-width:50px;text-align:right}
.bugsel{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:600 13px system-ui,sans-serif;padding:0 8px}
.bugsel.on{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.bufwrap{position:relative}
.dl{display:none;position:absolute;inset:12px;border-radius:12px;background:rgba(220,38,38,.12);border:2px solid var(--red);place-items:center;text-align:center;color:var(--red);font:800 34px ui-monospace,monospace;pointer-events:none;backdrop-filter:blur(1px)}
.dl.on{display:grid}
.dl small{display:block;font:700 15px ui-monospace,monospace;margin-top:6px}
.last .bad{color:var(--red)}
pre .x{color:#fca5a5;font-weight:700}

/* ---------- log ---------- */
.logc{display:flex;flex-direction:column;min-height:0;padding:10px 14px 12px}
.logbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logbar .n{margin-left:auto;font:12px ui-monospace,monospace;color:var(--muted)}
.logbar .btn{height:30px;font-size:12.5px;padding:0 10px}
pre{flex:1;min-height:0;margin:0;background:var(--term);color:var(--term-ink);border-radius:10px;padding:10px 14px;overflow:auto;font-size:12.5px;line-height:1.55;white-space:pre}
pre .p{color:#86efac} pre .c{color:#93c5fd} pre .h{color:#fcd34d}

@media (max-width:1400px){.vsep{display:none}.actions .t{display:none}.actions .btn{width:40px;padding:0;justify-content:center}.actions .btn.primary{width:auto;padding:0 14px}.actions .btn.primary .t{display:inline}.ctl .label{font-size:10px}}
@media (max-width:1000px){
  body{display:block}
  main{grid-template-rows:auto auto 340px}
  .stage{grid-template-columns:1fr;gap:12px}
  .flow{display:none}
  .threads{max-height:none}
  .sems{grid-template-columns:1fr 1fr}
  .actions{margin-left:0}
}
</style>
</head>
<body>
<header>
  <a class="back" href="/" title="Нүүр">←</a>
  <div class="title"><h1>Producer–Consumer</h1><span class="tag">C · Pthreads</span></div>
  <div class="status">
    <span class="pill" id="pill">—</span>
    <span class="clock" id="clock">0.00 s</span>
    <span class="pill" id="spd">1×</span>
  </div>
</header>

<main>
  <section class="card">
    <div class="toolbar">
      <div class="ctl"><span class="label">BUFFER_SIZE</span><div class="stp" data-for="size"><button type="button">−</button><input id="size" type="number" min="1" max="20" value="5"><button type="button">+</button></div></div>
      <div class="ctl"><span class="label">producers</span><div class="stp" data-for="prod"><button type="button">−</button><input id="prod" type="number" min="1" max="10" value="2"><button type="button">+</button></div></div>
      <div class="ctl"><span class="label">consumers</span><div class="stp" data-for="cons"><button type="button">−</button><input id="cons" type="number" min="1" max="10" value="2"><button type="button">+</button></div></div>
      <div class="vsep"></div>
      <div class="ctl"><span class="label">producer sleep</span><div class="sl p"><input id="psleep" type="range" min="0" max="3" step="0.05" value="1"><output data-for="psleep" data-u=" s"></output></div></div>
      <div class="ctl"><span class="label">consumer sleep</span><div class="sl c"><input id="csleep" type="range" min="0" max="3" step="0.05" value="1"><output data-for="csleep" data-u=" s"></output></div></div>
      <div class="ctl"><span class="label">хурд</span><div class="sl"><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"><output data-for="speed" data-u="×"></output></div></div>
      <div class="ctl"><span class="label">алдаа</span><select id="bug" class="bugsel">
        <option value="none">✓ зөв код</option>
        <option value="no_mutex">mutex-гүй → race</option>
        <option value="no_empty">wait(empty)-гүй → overflow</option>
        <option value="no_full">wait(full)-гүй → underflow</option>
        <option value="order">lock → wait дараалал → deadlock</option>
      </select></div>
      <label class="chk"><input id="paused" type="checkbox">step</label>
      <div class="actions">
        <button class="btn primary" id="bStart" title="Start">▶<span class="t"> Start</span></button>
        <button class="btn" id="bPause" title="Pause">⏸<span class="t"> Pause</span></button>
        <button class="btn" id="bStep" title="Step">⏭<span class="t"> Step</span></button>
        <button class="btn" id="bStop" title="Stop">■<span class="t"> Stop</span></button>
        <button class="btn icon" id="bReset" title="Reset">↺</button>
      </div>
    </div>
    <div class="err" id="err"></div>
  </section>

  <section class="card stage">
    <div class="col">
      <div class="colhead"><span class="dot" style="background:var(--green)"></span><b>producers</b></div>
      <div class="threads" id="prods"><div class="empty">—</div></div>
    </div>
    <div class="flow">→</div>
    <div class="center">
      <div class="bufwrap">
        <div class="bufhead"><span class="label">buffer</span><span class="racebadge" id="race">⚠ race 0</span><code id="decl">buffer_item buffer[5]</code></div>
        <div class="buf" id="outRow"></div>
        <div class="buf" id="cells"></div>
        <div class="buf" id="idxRow"></div>
        <div class="buf" id="inRow"></div>
        <div class="last" id="last"></div>
        <div class="dl" id="dl"><div>⛔ DEADLOCK<small id="dlw"></small></div></div>
      </div>
      <div class="sems">
        <div class="sem" id="sEmpty"><div class="top"><span class="name">empty</span><span class="type">sem_t</span></div><div class="val" id="vEmpty">–</div><div class="bar" id="bEmpty"></div></div>
        <div class="sem" id="sFull"><div class="top"><span class="name">full</span><span class="type">sem_t</span></div><div class="val" id="vFull">–</div><div class="bar" id="bFull"></div></div>
        <div class="sem" id="sMutex" style="color:var(--green)"><div class="top" style="color:var(--ink)"><span class="name">mutex</span><span class="type">pthread_mutex</span></div>
          <div class="lock"><svg viewBox="0 0 48 48" aria-hidden="true"><path id="shackle" d="M15 22v-6a9 9 0 0 1 18 0v-3" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" transform="translate(0 -4)"/><rect x="9" y="21" width="30" height="22" rx="6" fill="currentColor"/></svg><b id="vMutex">free</b></div>
          <div class="mq" id="mWait"></div></div>
        <div class="sem">
          <div class="totals"><div>produced<b id="vProd">0</b></div><div>consumed<b id="vCons">0</b></div><div>buffer<b id="vCount">0</b></div></div>
          <div class="check" id="check">—</div>
        </div>
      </div>
    </div>
    <div class="flow">→</div>
    <div class="col">
      <div class="colhead"><span class="dot" style="background:var(--blue)"></span><b>consumers</b></div>
      <div class="threads" id="conss"><div class="empty">—</div></div>
    </div>
  </section>

  <section class="card logc">
    <div class="logbar">
      <span class="label">log</span>
      <span class="n" id="logN">0</span>
      <button class="btn" id="dlTxt">⬇ .txt</button>
      <button class="btn" id="dlCsv">⬇ .csv</button>
      <button class="btn icon" id="clrLog" title="Цэвэрлэх">✕</button>
    </div>
    <pre id="log"></pre>
  </section>
</main>

<script>
"use strict";
const API = "/api/c";
const $ = s => document.querySelector(s);
const CODE = {
  P: {sleeping: "nanosleep()", producing: "item = rand()", paused: "— step —",
      wsem: "sem_wait(&empty)", lock: "pthread_mutex_lock(&mutex)", crit: "buffer[in] = item", stopped: "pthread_exit()", idle: "—"},
  C: {sleeping: "nanosleep()", consuming: "use(item)", paused: "— step —",
      wsem: "sem_wait(&full)", lock: "pthread_mutex_lock(&mutex)", crit: "item = buffer[out]", stopped: "pthread_exit()", idle: "—"},
};
const RACE_TXT = {1: "!! slot was still full -> an item is lost", 2: "!! slot was empty -> read garbage"};
const RACE_MN = {1: "дарж бичив, өмнөх item алга болов", 2: "хоосон нүднээс уншив"};
let run = -1, seq = 0, sim = null, nKey = "", logLines = [], fullLog = [], csvRows = [], runInfo = null, summarized = false;
let holder = null, dlLogged = false;   // {who, until}: last thread inside the critical section (the real lock lasts microseconds)

/* ---------- log ---------- */
function plainLine(e){
  const t = e.t.toFixed(3).padStart(7, " "), who = e.who.padEnd(3, " "), it = String(e.item).padStart(2, " ");
  const tail = e.count == null ? "" : `   (buffer ${e.count}/${sim ? sim.slots.length : "?"})`;
  const race = e.err ? "   " + RACE_TXT[e.err] : "";
  return e.kind === "insert"
    ? `[${t}s] producer ${who} produced ${it} -> slot ${e.slot}${tail}${race}`
    : `[${t}s] consumer ${who} consumed ${it} <- slot ${e.slot}${tail}${race}`;
}
const htmlLine = p => p.replace(/(producer \S+)/, '<span class="p">$1</span>').replace(/(consumer \S+)/, '<span class="c">$1</span>').replace(/(!! .*)$/, '<span class="x">$1</span>');
function addLog(html, plain){
  logLines.push(html);
  if (logLines.length > 600) logLines.splice(0, logLines.length - 600);
  if (plain !== undefined){ fullLog.push(plain); if (fullLog.length > 200000) fullLog.shift(); }
}
function flushLog(){
  const pre = $("#log");
  const atEnd = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 30;
  pre.innerHTML = logLines.join("\n");
  if (atEnd) pre.scrollTop = pre.scrollHeight;
  $("#logN").textContent = fullLog.length + " lines";
}
function flash(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function onEvent(e){
  const plain = plainLine(e);
  addLog(htmlLine(plain), plain);
  csvRows.push([e.t.toFixed(3), e.who, e.kind === "insert" ? "producer" : "consumer",
                e.kind === "insert" ? "insert_item" : "remove_item", e.item, e.slot, e.count ?? "", sim ? sim.slots.length : "",
                e.err === 1 ? "overwrite" : e.err === 2 ? "empty_read" : ""].join(","));
  if (csvRows.length > 200000) csvRows.shift();
  holder = {who: e.who, until: performance.now() + 500};
  const cell = document.querySelectorAll("#cells .cell")[e.slot];
  if (cell){
    cell.classList.remove("fin", "fout");
    if (e.err){ flash(cell, "race"); clearTimeout(cell._rt); cell._rt = setTimeout(() => cell.classList.remove("race"), 2500); }
    else flash(cell, e.kind === "insert" ? "fin" : "fout");
  }
  flash(document.querySelector(`.th[data-k="${e.who}"]`), e.err ? "bad" : "hit");
  const txt = e.kind === "insert" ? `${e.who} → buffer[${e.slot}] = ${e.item}` : `buffer[${e.slot}] → ${e.who} (${e.item})`;
  $("#last").innerHTML = e.err ? `<span class="bad">⚠ ${txt} · ${RACE_MN[e.err]}</span>`
    : `<span class="${e.kind === "insert" ? "in" : "out"}">${txt}</span>`;
}
function stamp(){
  const d = new Date(), z = x => String(x).padStart(2, "0");
  return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- view ---------- */
function build(s){
  const n = s.slots.length, cols = `repeat(${n}, minmax(0,1fr))`;
  for (const id of ["#outRow", "#cells", "#idxRow", "#inRow"]) $(id).style.gridTemplateColumns = cols;
  $("#cells").innerHTML = s.slots.map(() => `<div class="cell"></div>`).join("");
  $("#idxRow").innerHTML = s.slots.map((_, i) => `<div class="idx">${i}</div>`).join("");
  $("#outRow").innerHTML = s.slots.map(() => `<div class="ptr out"><span>out ▼</span></div>`).join("");
  $("#inRow").innerHTML = s.slots.map(() => `<div class="ptr in"><span>▲ in</span></div>`).join("");
  $("#bEmpty").innerHTML = $("#bFull").innerHTML = s.slots.map(() => "<i></i>").join("");
  const card = k => `<div class="th" data-k="${k}" data-st="idle"><div class="row"><span class="nm">${k}</span><span class="st">idle</span></div><code>—</code></div>`;
  const names = Object.keys(s.states);
  $("#prods").innerHTML = names.filter(k => k[0] === "P").map(card).join("");
  $("#conss").innerHTML = names.filter(k => k[0] === "C").map(card).join("");
  $("#decl").textContent = `buffer_item buffer[${n}]`;
  nKey = n + "|" + names.join(",");
}
function clearView(){
  nKey = "";
  for (const id of ["#outRow", "#cells", "#idxRow", "#inRow", "#bEmpty", "#bFull"]) $(id).innerHTML = "";
  $("#prods").innerHTML = $("#conss").innerHTML = `<div class="empty">—</div>`;
  for (const id of ["#vEmpty", "#vFull"]) $(id).textContent = "–";
  for (const id of ["#vProd", "#vCons", "#vCount"]) $(id).textContent = "0";
  $("#sEmpty").classList.remove("zero"); $("#sFull").classList.remove("zero");
  $("#vMutex").textContent = "free"; $("#sMutex").style.color = "var(--green)"; $("#mWait").innerHTML = "";
  $("#check").textContent = "—"; $("#check").className = "check"; $("#last").textContent = "";
  $("#sMutex").classList.remove("off"); $("#race").classList.remove("on");
}

function render(s){
  const live = s && !s.stopped;
  $("#bStart").disabled = !!live;
  for (const id of ["#bPause", "#bStep", "#bStop"]) $(id).disabled = !live;
  const pz = s && s.paused && live ? "r" : "p";
  if ($("#bPause").dataset.m !== pz){ $("#bPause").dataset.m = pz; $("#bPause").innerHTML = pz === "r" ? '▶<span class="t"> Resume</span>' : '⏸<span class="t"> Pause</span>'; }
  for (const id of ["#size", "#prod", "#cons", "#paused"]) $(id).disabled = !!live;
  $("#bug").disabled = !!live;
  document.querySelectorAll(".stp button").forEach(b => b.disabled = !!live);
  const pill = $("#pill");
  if (!s){
    pill.className = "pill"; pill.textContent = "ready"; $("#clock").textContent = "0.00 s";
    if (nKey) clearView();
    return;
  }
  if (nKey !== s.slots.length + "|" + Object.keys(s.states).join(",")) build(s);

  pill.className = "pill " + (s.stopped ? "stop" : s.paused ? "pause" : "run");
  pill.textContent = s.stopped ? "stopped" : s.paused ? "paused" : "running";
  $("#clock").textContent = s.elapsed.toFixed(2) + " s";
  $("#spd").textContent = s.speed + "×";

  document.querySelectorAll("#cells .cell").forEach((el, i) => {
    const v = s.slots[i];
    el.textContent = v === null ? "" : v;
    el.classList.toggle("full", v !== null);
  });
  document.querySelectorAll("#outRow .ptr").forEach((el, i) => el.classList.toggle("on", i === s.out_idx));
  document.querySelectorAll("#inRow .ptr").forEach((el, i) => el.classList.toggle("on", i === s.in_idx));

  const sem = (box, val, bar, v) => {
    $(val).textContent = v;
    $(box).classList.toggle("zero", v === 0);
    $(bar).querySelectorAll("i").forEach((el, i) => el.classList.toggle("on", i < v));
  };
  sem("#sEmpty", "#vEmpty", "#bEmpty", s.empty);
  sem("#sFull", "#vFull", "#bFull", s.full);
  const mOn = s.mutex_on !== false, bug = s.bug || "none";
  const kh = mOn && holder && holder.until > performance.now() && !s.stopped ? holder : null;
  const own = !s.stopped && s.owner ? s.owner : null;
  const locked = mOn && (!!own || s.mutex_locked || !!kh);
  $("#sMutex").classList.toggle("off", !mOn);
  $("#vMutex").textContent = !mOn ? "OFF" : own || (kh ? kh.who : (locked ? "locked" : "free"));
  $("#sMutex").style.color = locked ? "var(--red)" : "var(--green)";
  $("#shackle").setAttribute("transform", locked ? "" : "translate(0 -4)");
  $("#shackle").setAttribute("d", locked ? "M15 22v-6a9 9 0 0 1 18 0v6" : "M15 22v-6a9 9 0 0 1 18 0v-3");
  const lockWait = s.stopped || !mOn ? [] : s.waits ? Object.keys(s.waits).filter(k => s.waits[k] === "lock")
    : Object.entries(s.states).filter(([k, st]) => st === "waiting" && (k[0] === "P" ? s.empty : s.full) > 0).map(([k]) => k);
  $("#mWait").innerHTML = lockWait.length ? "⏳ " + lockWait.map(k => `<span class="w">${k}</span>`).join("") : "";

  const races = (s.lost || 0) + (s.bad_reads || 0);
  const count = s.slots.filter(x => x !== null).length, ok = s.produced - s.consumed === count && races === 0;
  $("#vProd").textContent = s.produced; $("#vCons").textContent = s.consumed; $("#vCount").textContent = count;
  $("#race").textContent = `⚠ ${races}`; $("#race").classList.toggle("on", (bug !== "none" && bug !== "order") || races > 0);
  const dl = !!s.deadlock;
  $("#dl").classList.toggle("on", dl);
  if (dl && s.owner) $("#dlw").textContent = `${s.owner} 🔒 mutex → sem_wait(&${s.owner[0] === "P" ? "empty" : "full"})`;
  const ch = $("#check");
  ch.textContent = dl ? "⛔ deadlock" : races ? "✗ " + [s.lost ? `lost ${s.lost}` : "", s.bad_reads ? `garbage ${s.bad_reads}` : ""].filter(Boolean).join(" · ")
    : `${s.produced} − ${s.consumed} = ${count} ${ok ? "✓" : (s.stopped ? "✗" : "…")}`;
  ch.className = "check " + (ok && !dl ? "ok" : s.stopped || races || dl ? "bad" : "");

  document.querySelectorAll(".th").forEach(row => {
    const k = row.dataset.k, st = s.states[k] || "idle", side = k[0];
    let code = CODE[side][st] || "";
    const semZero = (side === "P" ? s.empty : s.full) === 0;
    const w = s.waits ? s.waits[k] : null;
    let crit = false;
    if (st === "waiting" && !s.stopped){
      if (w === "sem"){ code = CODE[side].wsem; if (own === k){ code = "🔒 " + code; crit = true; } }   // waits holding the lock
      else if (w === "lock") code = CODE[side].lock;
      else if (w === ""){ code = CODE[side].crit; crit = !mOn; }       // inside the buffer code
      else code = semZero ? CODE[side].wsem : (mOn ? CODE[side].lock : CODE[side].crit);
    }
    row.classList.toggle("crit", crit);
    if (row.dataset.st !== st) row.dataset.st = st;
    row.querySelector(".st").textContent = st;
    row.querySelector("code").textContent = code;
  });
}

/* ---------- polling ---------- */
async function poll(){
  try{
    const r = await fetch(API + "/state?since=" + seq, {cache: "no-store"});
    const d = await r.json();
    if (r.status === 503){ showErr(d.error); setTimeout(poll, 2000); return; }
    if (d.run !== run){
      run = d.run; logLines = []; fullLog = []; csvRows = []; sim = null; runInfo = null; summarized = false;
      clearView(); flushLog();
    }
    if (d.sim && !sim){
      const c = d.config || {};
      const bug = d.sim.bug || c.bug || "none", bi = ["none", "no_mutex", "no_empty", "no_full", "order"].indexOf(bug);
      runInfo = {when: new Date().toLocaleString(), size: d.sim.slots.length, prod: c.prod, cons: c.cons, psleep: c.psleep, csleep: c.csleep, bug};
      const cmd = `$ ./producer_consumer --ui ${runInfo.size} ${c.prod} ${c.cons} ${c.psleep} ${c.csleep} ${d.sim.speed} ${d.sim.paused ? 1 : 0} ${Math.max(0, bi)}`;
      dlLogged = false;
      addLog(`<span class="h">${cmd}</span>`, cmd);
    }
    if (d.error) showErr(d.error);
    sim = d.sim;
    for (const e of d.events) onEvent(e);
    if (d.sim && d.sim.deadlock && !dlLogged && d.sim.owner){
      dlLogged = true;
      const o = d.sim.owner, line = `!! DEADLOCK: ${o} holds the mutex and waits in sem_wait(&${o[0] === "P" ? "empty" : "full"}); the others wait for the mutex`;
      addLog(`<span class="x">${line}</span>`, line);
    }
    if (d.sim && d.sim.stopped && !summarized){
      summarized = true;
      const c = d.sim.slots.filter(x => x !== null).length, lost = d.sim.lost || 0, bad = d.sim.bad_reads || 0;
      const ok = d.sim.produced - d.sim.consumed === c && lost + bad === 0 && !d.sim.deadlock;
      let line = `produced=${d.sim.produced} consumed=${d.sim.consumed} in_buffer=${c} -> ${d.sim.deadlock ? "DEADLOCK" : ok ? "CONSISTENT" : "INCONSISTENT"}`;
      if ((d.sim.bug && d.sim.bug !== "none" && !d.sim.deadlock) || (!ok && !d.sim.deadlock)) line += `\nerrors: lost_items=${lost} bad_reads=${bad}`;
      addLog(`\n<span class="h">${line}</span>`, "\n" + line);
    }
    if (d.events.length || d.sim) flushLog();
    seq = d.seq;
    render(d.sim);
  }catch(e){ /* retry */ }
  setTimeout(poll, 100);
}

/* ---------- controls ---------- */
function showErr(msg){ const e = $("#err"); e.textContent = msg || ""; e.style.display = msg ? "block" : "none"; }
async function api(action, body){
  try{
    const r = await fetch(API + "/" + action, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok){ showErr(d.error || "Алдаа"); return false; }
    showErr(""); return true;
  }catch(e){ showErr("Сервертэй холбогдож чадсангүй (gui.py)"); return false; }
}
const val = id => $(id).value;
document.querySelectorAll(".stp").forEach(box => {
  const inp = box.querySelector("input"), [dec, inc] = box.querySelectorAll("button");
  const set = k => { inp.value = Math.max(+inp.min, Math.min(+inp.max, (parseInt(inp.value, 10) || +inp.min) + k)); };
  dec.onclick = () => set(-1); inc.onclick = () => set(1);
});
function slSync(){
  document.querySelectorAll(".sl output").forEach(o => { o.textContent = Number($("#" + o.dataset.for).value).toFixed(2) + o.dataset.u; });
  $("#bug").classList.toggle("on", $("#bug").value !== "none");
}
let tuneT = null, tuneLast = 0;
function sendTune(){
  tuneT = null; tuneLast = performance.now();
  if (sim && !sim.stopped) api("tune", {psleep: val("#psleep"), csleep: val("#csleep"), speed: val("#speed")});
}
for (const id of ["#psleep", "#csleep", "#speed"]){
  $(id).addEventListener("input", () => {             // live: at most ~8 updates per second while dragging
    slSync();
    if (!tuneT) tuneT = setTimeout(sendTune, Math.max(0, 120 - (performance.now() - tuneLast)));
  });
  $(id).addEventListener("change", () => { clearTimeout(tuneT); sendTune(); });
}
$("#bug").onchange = slSync;
slSync();
$("#bStart").onclick = () => api("start", {size: val("#size"), prod: val("#prod"), cons: val("#cons"),
  psleep: val("#psleep"), csleep: val("#csleep"), speed: val("#speed"), paused: $("#paused").checked,
  bug: val("#bug")});
$("#bPause").onclick = () => api(sim && sim.paused ? "resume" : "pause");
$("#bStep").onclick = () => api("step");
$("#bStop").onclick = () => api("stop");
$("#bReset").onclick = async () => { if (await api("reset")){ logLines = []; fullLog = []; csvRows = []; flushLog(); clearView(); } };
$("#clrLog").onclick = () => { logLines = []; fullLog = []; csvRows = []; flushLog(); };
$("#dlTxt").onclick = () => {
  if (!fullLog.length) return showErr("Лог хоосон байна.");
  const i = runInfo || {};
  const head = ["# Producer–Consumer · C / Pthreads (src/c/producer_consumer)",
    `# ${i.when || new Date().toLocaleString()}`,
    `# BUFFER_SIZE=${i.size ?? "?"} producers=${i.prod ?? "?"} consumers=${i.cons ?? "?"} producer_sleep=${i.psleep ?? "?"}s consumer_sleep=${i.csleep ?? "?"}s bug=${i.bug || "none"}`, ""];
  download(`pc_log_${stamp()}.txt`, head.concat(fullLog).join("\n") + "\n", "text/plain;charset=utf-8");
};
$("#dlCsv").onclick = () => {
  if (!csvRows.length) return showErr("Лог хоосон байна.");
  download(`pc_log_${stamp()}.csv`, "﻿time_s,thread,role,action,item,slot,buffer_count,buffer_size,race\n" + csvRows.join("\n") + "\n", "text/csv;charset=utf-8");
};
poll();
</script>
</body>
</html>
