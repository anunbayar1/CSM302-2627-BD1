<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Pthreads</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --green:#16a34a; --blue:#2563eb; --amber:#d97706; --amber-bg:#fef3c7;
  --red:#dc2626; --violet:#7c3aed; --gray:#9ca3af; --term:#0f172a; --term-ink:#e2e8f0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b0f17;--card:#121826;--ink:#e5e7eb;--muted:#9ca3af;--line:#243042;
        --accent:#60a5fa;--green:#4ade80;--blue:#60a5fa;--amber:#fbbf24;--amber-bg:#33270c;
        --red:#f87171;--violet:#c4b5fd;--gray:#6b7280;--term:#05070c;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",sans-serif}
.mono,code,pre{font-family:ui-monospace,"DejaVu Sans Mono",Menlo,monospace}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:600}
header a:hover{border-color:var(--accent)}
header h1{font-size:16px;margin:0}
.status{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:13px}
.status b{font-family:ui-monospace,monospace}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gray);margin-right:6px;vertical-align:1px}
.dot.run{background:var(--green)} .dot.pause{background:var(--violet)} .dot.stop{background:var(--red)}
main{max-width:1240px;margin:0 auto;padding:14px 20px 26px;display:grid;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;font-weight:600}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.controls label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.controls input,.controls select{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:600 14px ui-monospace,monospace}
.controls .chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink);padding-bottom:7px}
.ctl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.stp button{border:0;border-radius:0;background:transparent;width:30px;height:32px;padding:0;font:700 17px system-ui,sans-serif;color:var(--ink)}
.stp button:hover:not(:disabled){background:var(--line)}
.stp input{width:38px;border:0;background:transparent;text-align:center;padding:0;height:32px;font:700 15px ui-monospace,monospace;color:var(--ink);-moz-appearance:textfield}
.stp input::-webkit-inner-spin-button,.stp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pv{display:flex;gap:2px;height:8px;margin-top:2px}
.pv i{width:6px;height:8px;border-radius:1.5px;background:var(--amber)}
#pv-prod i{background:var(--green);border-radius:50%;width:8px} #pv-cons i{background:var(--blue);border-radius:50%;width:8px}
.pace{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.pace button{border:0;border-radius:0;padding:0 10px;height:32px;font:600 12.5px system-ui,sans-serif;color:var(--muted);background:transparent}
.pace button.on{background:var(--accent);color:#fff}
.pace button:hover:not(.on){background:var(--line)}
.controls .chk input{width:auto}
.btns{display:flex;gap:8px;margin-left:auto}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:7px 13px;font:600 13.5px system-ui,sans-serif;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.err{display:none;color:var(--red);font-weight:600;margin-top:10px}

.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}

/* buffer */
.buf{display:grid;gap:6px}
.ptr{text-align:center;font:700 12px ui-monospace,monospace;height:18px}
.ptr.out{color:var(--blue)} .ptr.in{color:var(--green)}
.cell{border:2px dashed var(--line);border-radius:8px;height:58px;display:grid;place-items:center;font:700 19px ui-monospace,monospace;color:var(--muted)}
.cell.full{border:2px solid var(--amber);background:var(--amber-bg);color:var(--ink)}
.cell.fin{animation:fin .6s ease-out} .cell.fout{animation:fout .6s ease-out}
@keyframes fin{0%{box-shadow:0 0 0 5px var(--green);transform:scale(1.07)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
@keyframes fout{0%{box-shadow:0 0 0 5px var(--blue);transform:scale(.93)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.idx{text-align:center;font:11px ui-monospace,monospace;color:var(--muted)}
.last{margin-top:10px;font:600 15px ui-monospace,monospace;min-height:22px}
.last .in{color:var(--green)} .last .out{color:var(--blue)}

/* semaphores */
.sems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.sem{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.sem .top{display:flex;justify-content:space-between;align-items:baseline}
.sem .name{font:700 14px ui-monospace,monospace}
.sem .type{font:11px ui-monospace,monospace;color:var(--muted)}
.sem .val{font:800 34px ui-monospace,monospace;line-height:1.15;margin:4px 0 6px}
.sem.zero{border-color:var(--red)} .sem.zero .val{color:var(--red)}
.bar{display:flex;gap:3px;flex-wrap:wrap}
.bar i{width:12px;height:12px;border-radius:3px;background:var(--line)}
#sEmpty .bar i.on{background:var(--green)} #sFull .bar i.on{background:var(--amber)}
.lock{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.lock svg{width:34px;height:34px}
.lock b{font:800 18px ui-monospace,monospace}
.mq{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-height:20px;font:12px ui-monospace,monospace;color:var(--muted)}
.mq .w{background:var(--amber);color:#fff;border-radius:999px;padding:1px 7px;font-weight:700}

/* threads */
.th{display:grid;grid-template-columns:44px 104px minmax(0,1fr);align-items:center;gap:10px;padding:7px 8px;border-radius:7px;border-bottom:1px solid var(--line)}
.th:last-child{border-bottom:0}
.th.waiting{background:var(--amber-bg)}
.th .nm{font:700 14px ui-monospace,monospace}
.pill{font:700 11.5px ui-monospace,monospace;padding:3px 8px;border-radius:999px;color:#fff;background:var(--gray);text-align:center}
.pill.producing{background:var(--green)} .pill.consuming{background:var(--blue)}
.pill.waiting{background:var(--amber)} .pill.paused{background:var(--violet)}
.th code{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.waiting code{color:var(--amber);font-weight:700}

/* totals */
.totals{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.totals b{font:800 20px ui-monospace,monospace;color:var(--ink);margin-left:4px}
.check{margin-left:auto;font:700 13px ui-monospace,monospace;padding:4px 10px;border-radius:999px;background:var(--bg)}
.check.ok{color:var(--green)} .check.bad{color:var(--red)}

/* log */
.logbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.logtools{display:flex;gap:8px;align-items:center}
.logtools .n{font:12.5px ui-monospace,monospace;color:var(--muted)}
.logtools button{padding:5px 10px;font-size:12.5px}
pre{margin:0;background:var(--term);color:var(--term-ink);border-radius:8px;padding:10px 12px;height:260px;overflow:auto;font-size:12.5px;line-height:1.5;white-space:pre}
pre .p{color:#86efac} pre .c{color:#93c5fd} pre .h{color:#fcd34d}
@media (max-width:900px){.grid{grid-template-columns:1fr}.status{margin-left:0}.btns{margin-left:0}}
</style>
</head>
<body>
<header>
  <a href="/">←</a>
  <h1>C · Pthreads</h1>
  <div class="status">
    <span><span class="dot" id="dot"></span><span id="stText">—</span></span>
    <span>t <b id="t">0.00</b>s</span>
    <span><b id="spd">1×</b></span>
  </div>
</header>

<main>
  <section>
    <div class="controls">
      <div class="ctl"><span>BUFFER_SIZE</span><div class="stp" data-for="size"><button type="button">−</button><input id="size" type="number" min="1" max="20" value="5"><button type="button">+</button></div><div class="pv" id="pv-size"></div></div>
      <div class="ctl"><span>producers</span><div class="stp" data-for="prod"><button type="button">−</button><input id="prod" type="number" min="1" max="10" value="2"><button type="button">+</button></div><div class="pv" id="pv-prod"></div></div>
      <div class="ctl"><span>consumers</span><div class="stp" data-for="cons"><button type="button">−</button><input id="cons" type="number" min="1" max="10" value="2"><button type="button">+</button></div><div class="pv" id="pv-cons"></div></div>
      <div class="ctl"><span>producer хурд</span><div class="pace" data-for="psleep"><button type="button" data-v="2">удаан</button><button type="button" data-v="1">дунд</button><button type="button" data-v="0.3">хурдан</button></div><input id="psleep" type="hidden" value="1"></div>
      <div class="ctl"><span>consumer хурд</span><div class="pace" data-for="csleep"><button type="button" data-v="2">удаан</button><button type="button" data-v="1">дунд</button><button type="button" data-v="0.3">хурдан</button></div><input id="csleep" type="hidden" value="1"></div>
      <label>хурд<select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
      <label class="chk"><input id="paused" type="checkbox">step</label>
      <div class="btns">
        <button id="bStart" class="primary">▶ Start</button>
        <button id="bPause">⏸ Pause</button>
        <button id="bStep">⏭ Step</button>
        <button id="bStop">■ Stop</button>
        <button id="bReset" title="Reset">↺</button>
      </div>
    </div>
    <div class="err" id="err"></div>
  </section>

  <div class="grid">
    <section>
      <h2>buffer</h2>
      <div class="buf" id="outRow"></div>
      <div class="buf" id="cells"></div>
      <div class="buf" id="idxRow"></div>
      <div class="buf" id="inRow"></div>
      <div class="last" id="last"></div>

      <div class="sems">
        <div class="sem" id="sEmpty"><div class="top"><span class="name">empty</span><span class="type">sem_t</span></div><div class="val" id="vEmpty">–</div><div class="bar" id="bEmpty"></div></div>
        <div class="sem" id="sFull"><div class="top"><span class="name">full</span><span class="type">sem_t</span></div><div class="val" id="vFull">–</div><div class="bar" id="bFull"></div></div>
        <div class="sem" id="sMutex" style="color:var(--green)"><div class="top" style="color:var(--ink)"><span class="name">mutex</span><span class="type">pthread_mutex_t</span></div>
          <div class="lock"><svg viewBox="0 0 48 48" aria-hidden="true"><path id="shackle" d="M15 22v-6a9 9 0 0 1 18 0v-3" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" transform="translate(0 -4)"/><rect x="9" y="21" width="30" height="22" rx="6" fill="currentColor"/></svg><b id="vMutex">free</b></div>
          <div class="mq" id="mWait"></div></div>
      </div>

      <div class="totals">
        <span>produced<b id="vProd">0</b></span>
        <span>consumed<b id="vCons">0</b></span>
        <span>buffer<b id="vCount">0</b></span>
        <span class="check" id="check">—</span>
      </div>
    </section>

    <section>
      <h2>threads</h2>
      <div id="threads" style="color:var(--muted)">—</div>
    </section>
  </div>

  <section>
    <div class="logbar">
      <h2 style="margin:0">log</h2>
      <div class="logtools">
        <span class="n" id="logN">0</span>
        <button id="dlTxt">⬇ .txt</button>
        <button id="dlCsv">⬇ .csv</button>
        <button id="clrLog" title="Цэвэрлэх">✕</button>
      </div>
    </div>
    <pre id="log"></pre>
  </section>
</main>

<script>
"use strict";
const API = "/api/c";
const $ = s => document.querySelector(s);
const CODE = {
  P: {sleeping: "nanosleep()", producing: "item = rand()", paused: "— step —",
      wsem: "sem_wait(&empty)", lock: "pthread_mutex_lock()", stopped: "—", idle: "—"},
  C: {sleeping: "nanosleep()", consuming: "use(item)", paused: "— step —",
      wsem: "sem_wait(&full)", lock: "pthread_mutex_lock()", stopped: "—", idle: "—"},
};
let run = -1, seq = 0, sim = null, nKey = "", logLines = [], fullLog = [], csvRows = [], runInfo = null, summarized = false;
let holder = null;   // {who, until}: last thread inside the critical section

/* ---------- log ---------- */
function plainLine(e){
  const t = e.t.toFixed(3).padStart(7, " "), who = e.who.padEnd(3, " "), it = String(e.item).padStart(2, " ");
  const tail = e.count == null ? "" : `   (buffer ${e.count}/${sim ? sim.slots.length : "?"})`;
  return e.kind === "insert"
    ? `[${t}s] producer ${who} produced ${it} -> slot ${e.slot}${tail}`
    : `[${t}s] consumer ${who} consumed ${it} <- slot ${e.slot}${tail}`;
}
const htmlLine = p => p.replace(/(producer \S+)/, '<span class="p">$1</span>').replace(/(consumer \S+)/, '<span class="c">$1</span>');
function addLog(html, plain){
  logLines.push(html);
  if (logLines.length > 600) logLines.splice(0, logLines.length - 600);
  if (plain !== undefined){ fullLog.push(plain); if (fullLog.length > 200000) fullLog.shift(); }
}
function flushLog(){
  const pre = $("#log");
  const atEnd = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 30;
  pre.innerHTML = logLines.join("\n");
  if (atEnd) pre.scrollTop = pre.scrollHeight;
  $("#logN").textContent = fullLog.length;
}
function onEvent(e){
  const plain = plainLine(e);
  addLog(htmlLine(plain), plain);
  csvRows.push([e.t.toFixed(3), e.who, e.kind === "insert" ? "producer" : "consumer",
                e.kind === "insert" ? "insert_item" : "remove_item", e.item, e.slot, e.count ?? "", sim ? sim.slots.length : ""].join(","));
  if (csvRows.length > 200000) csvRows.shift();
  holder = {who: e.who, until: performance.now() + 500};
  const cell = document.querySelectorAll("#cells .cell")[e.slot];
  if (cell){ cell.classList.remove("fin", "fout"); void cell.offsetWidth; cell.classList.add(e.kind === "insert" ? "fin" : "fout"); }
  $("#last").innerHTML = e.kind === "insert"
    ? `<span class="in">${e.who} → [${e.slot}] = ${e.item}</span>`
    : `<span class="out">${e.who} ← [${e.slot}] = ${e.item}</span>`;
}
function stamp(){
  const d = new Date(), z = x => String(x).padStart(2, "0");
  return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- view ---------- */
function build(s){
  const n = s.slots.length, cols = `repeat(${n}, minmax(0,1fr))`;
  for (const id of ["#outRow", "#cells", "#idxRow", "#inRow"]) $(id).style.gridTemplateColumns = cols;
  $("#cells").innerHTML = s.slots.map(() => `<div class="cell"></div>`).join("");
  $("#idxRow").innerHTML = s.slots.map((_, i) => `<div class="idx">${i}</div>`).join("");
  $("#outRow").innerHTML = s.slots.map(() => `<div class="ptr out"></div>`).join("");
  $("#inRow").innerHTML = s.slots.map(() => `<div class="ptr in"></div>`).join("");
  $("#bEmpty").innerHTML = $("#bFull").innerHTML = s.slots.map(() => "<i></i>").join("");
  $("#threads").innerHTML = Object.keys(s.states).map(k =>
    `<div class="th" data-k="${k}"><span class="nm">${k}</span><span class="pill"></span><code></code></div>`).join("");
  $("#threads").style.color = "";
  nKey = n + "|" + Object.keys(s.states).join(",");
}

function render(s){
  const live = s && !s.stopped;
  $("#bStart").disabled = !!live;
  for (const id of ["#bPause", "#bStep", "#bStop"]) $(id).disabled = !live;
  $("#bPause").textContent = s && s.paused && live ? "▶ Resume" : "⏸ Pause";
  for (const id of ["#size", "#prod", "#cons", "#paused"]) $(id).disabled = !!live;
  document.querySelectorAll(".stp button").forEach(b => b.disabled = !!live);
  if (!s){ $("#dot").className = "dot"; $("#stText").textContent = "—"; $("#t").textContent = "0.00"; return; }
  if (nKey !== s.slots.length + "|" + Object.keys(s.states).join(",")) build(s);

  $("#dot").className = "dot " + (s.stopped ? "stop" : s.paused ? "pause" : "run");
  $("#stText").textContent = s.stopped ? "stopped" : s.paused ? "paused" : "running";
  $("#t").textContent = s.elapsed.toFixed(2);
  $("#spd").textContent = s.speed + "×";

  document.querySelectorAll("#cells .cell").forEach((el, i) => {
    const v = s.slots[i];
    el.textContent = v === null ? "" : v;
    el.classList.toggle("full", v !== null);
  });
  document.querySelectorAll("#outRow .ptr").forEach((el, i) => el.textContent = i === s.out_idx ? "out ▼" : "");
  document.querySelectorAll("#inRow .ptr").forEach((el, i) => el.textContent = i === s.in_idx ? "▲ in" : "");

  const sem = (box, val, bar, v) => {
    $(val).textContent = v;
    $(box).classList.toggle("zero", v === 0);
    $(bar).querySelectorAll("i").forEach((el, i) => el.classList.toggle("on", i < v));
  };
  sem("#sEmpty", "#vEmpty", "#bEmpty", s.empty);
  sem("#sFull", "#vFull", "#bFull", s.full);
  // the real lock is held for microseconds: show its last owner for a moment
  const kh = holder && holder.until > performance.now() && !s.stopped ? holder : null;
  const locked = s.mutex_locked || !!kh;
  $("#vMutex").textContent = kh ? kh.who : (locked ? "locked" : "free");
  $("#sMutex").style.color = locked ? "var(--red)" : "var(--green)";
  $("#shackle").setAttribute("transform", locked ? "" : "translate(0 -4)");
  $("#shackle").setAttribute("d", locked ? "M15 22v-6a9 9 0 0 1 18 0v6" : "M15 22v-6a9 9 0 0 1 18 0v-3");
  const lockWait = s.stopped ? [] : Object.entries(s.states).filter(([k, st]) =>
    st === "waiting" && (k[0] === "P" ? s.empty : s.full) > 0).map(([k]) => k);
  $("#mWait").innerHTML = lockWait.length ? "⏳ " + lockWait.map(k => `<span class="w">${k}</span>`).join("") : "";

  const count = s.slots.filter(x => x !== null).length, ok = s.produced - s.consumed === count;
  $("#vProd").textContent = s.produced; $("#vCons").textContent = s.consumed; $("#vCount").textContent = count;
  const ch = $("#check");
  ch.textContent = `${s.produced} − ${s.consumed} = ${count} ${ok ? "✓" : (s.stopped ? "✗" : "…")}`;
  ch.className = "check " + (ok ? "ok" : s.stopped ? "bad" : "");

  document.querySelectorAll("#threads .th").forEach(row => {
    const k = row.dataset.k, st = s.states[k] || "idle", side = k[0];
    let code = CODE[side][st] || "";
    if (st === "waiting") code = (side === "P" ? s.empty : s.full) === 0 ? CODE[side].wsem : CODE[side].lock;
    row.className = "th" + (st === "waiting" ? " waiting" : "");
    const pill = row.children[1];
    pill.className = "pill " + st; pill.textContent = st;
    row.children[2].textContent = code;
  });
}

/* ---------- polling ---------- */
async function poll(){
  try{
    const r = await fetch(API + "/state?since=" + seq, {cache: "no-store"});
    const d = await r.json();
    if (r.status === 503){ showErr(d.error); setTimeout(poll, 2000); return; }
    if (d.run !== run){
      run = d.run; logLines = []; fullLog = []; csvRows = []; nKey = ""; sim = null; runInfo = null; summarized = false;
      $("#last").textContent = "";
    }
    if (d.sim && !sim){
      const c = d.config || {};
      runInfo = {when: new Date().toLocaleString(), size: d.sim.slots.length, prod: c.prod, cons: c.cons, psleep: c.psleep, csleep: c.csleep};
      const cmd = `$ ./producer_consumer --ui ${runInfo.size} ${c.prod} ${c.cons} ${c.psleep} ${c.csleep} ${d.sim.speed} ${d.sim.paused ? 1 : 0}`;
      addLog(`<span class="h">${cmd}</span>`, cmd);
    }
    sim = d.sim;
    for (const e of d.events) onEvent(e);
    if (d.sim && d.sim.stopped && !summarized){
      summarized = true;
      const c = d.sim.slots.filter(x => x !== null).length, ok = d.sim.produced - d.sim.consumed === c;
      const line = `produced=${d.sim.produced} consumed=${d.sim.consumed} in_buffer=${c} -> ${ok ? "CONSISTENT" : "INCONSISTENT"}`;
      addLog(`\n<span class="h">${line}</span>`, "\n" + line);
    }
    if (d.events.length || d.sim) flushLog();
    seq = d.seq;
    render(d.sim);
  }catch(e){ /* retry */ }
  setTimeout(poll, 100);
}

/* ---------- controls ---------- */
function showErr(msg){ const e = $("#err"); e.textContent = msg || ""; e.style.display = msg ? "block" : "none"; }
async function api(action, body){
  try{
    const r = await fetch(API + "/" + action, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok){ showErr(d.error || "Алдаа"); return false; }
    showErr(""); return true;
  }catch(e){ showErr("Сервертэй холбогдож чадсангүй (gui.py)"); return false; }
}
const val = id => $(id).value;
function preview(id){
  const n = Math.max(0, Math.min(20, parseInt($("#" + id).value, 10) || 0));
  $("#pv-" + id).innerHTML = "<i></i>".repeat(n);
}
document.querySelectorAll(".stp").forEach(box => {
  const inp = box.querySelector("input"), [dec, inc] = box.querySelectorAll("button");
  const set = k => { const v = Math.max(+inp.min, Math.min(+inp.max, (parseInt(inp.value, 10) || +inp.min) + k)); inp.value = v; preview(inp.id); };
  dec.onclick = () => set(-1); inc.onclick = () => set(1);
  inp.addEventListener("input", () => preview(inp.id));
  preview(inp.id);
});
function paceSync(){
  document.querySelectorAll(".pace").forEach(g => {
    const v = Number($("#" + g.dataset.for).value);
    g.querySelectorAll("button").forEach(b => b.classList.toggle("on", Number(b.dataset.v) === v));
  });
}
document.querySelectorAll(".pace").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
  $("#" + g.dataset.for).value = b.dataset.v; paceSync();
  if (sim && !sim.stopped) api("tune", {psleep: val("#psleep"), csleep: val("#csleep"), speed: val("#speed")});
}));
paceSync();
$("#bStart").onclick = () => api("start", {size: val("#size"), prod: val("#prod"), cons: val("#cons"),
  psleep: val("#psleep"), csleep: val("#csleep"), speed: val("#speed"), paused: $("#paused").checked});
$("#bPause").onclick = () => api(sim && sim.paused ? "resume" : "pause");
$("#bStep").onclick = () => api("step");
$("#bStop").onclick = () => api("stop");
$("#bReset").onclick = async () => { if (await api("reset")){ logLines = []; fullLog = []; csvRows = []; flushLog(); } };
let tuneT;
for (const id of ["#speed"]) $(id).addEventListener("input", () => {
  if (!sim || sim.stopped) return;
  clearTimeout(tuneT);
  tuneT = setTimeout(() => api("tune", {psleep: val("#psleep"), csleep: val("#csleep"), speed: val("#speed")}), 150);
});
$("#clrLog").onclick = () => { logLines = []; fullLog = []; csvRows = []; flushLog(); };
$("#dlTxt").onclick = () => {
  if (!fullLog.length) return showErr("Лог хоосон байна.");
  const i = runInfo || {};
  const head = ["# Producer–Consumer · C / Pthreads (src/c/producer_consumer)",
    `# ${i.when || new Date().toLocaleString()}`,
    `# BUFFER_SIZE=${i.size ?? "?"} producers=${i.prod ?? "?"} consumers=${i.cons ?? "?"} producer_sleep=${i.psleep ?? "?"}s consumer_sleep=${i.csleep ?? "?"}s`, ""];
  download(`pc_log_${stamp()}.txt`, head.concat(fullLog).join("\n") + "\n", "text/plain;charset=utf-8");
};
$("#dlCsv").onclick = () => {
  if (!csvRows.length) return showErr("Лог хоосон байна.");
  download(`pc_log_${stamp()}.csv`, "﻿time_s,thread,role,action,item,slot,buffer_count,buffer_size\n" + csvRows.join("\n") + "\n", "text/csv;charset=utf-8");
};
poll();
</script>
